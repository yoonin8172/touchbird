<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>3단계</title>
    <script src="https://clickbattle2025.web.app/click-battle.js"></script>
    <script>ClickBattle.init("yoonin");</script>
    <style>
        @font-face {
            font-family: 'JoseonGulim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background: #000;
            color: white;
            font-family: 'JoseonGulim', sans-serif;
            overflow: hidden;
        }

        #ui {
            padding: 15px;
            font-size: 18px;
            line-height: 1.5;
            text-shadow: 0 0 5px black;
        }

        #counter-area {
            margin-top: 10px;
            font-size: 20px;
        }

        #bg {
            width: 100%;
            height: auto;
            max-height: 65vh;
            object-fit: contain;
            display: block;
            margin-top: 20px;
        }

        #touch-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div id="ui">
        <div id="title">
            <b>3단계: GPT보다 많이 터치하여 새를 구출하세요!<br>
                (화면을 터치하면 타이머가 시작됩니다.)</b>
        </div>

        <div id="counter-area">
            남은 시간: <span id="time">10</span>초<br>
            현재 터치 수: <span id="count">0</span>번
            GPT 터치 수: ?
        </div>
    </div>

    <img id="bg" src="./images/bird3.jpeg" alt="bird">

    <div id="touch-area"></div>

    <script>


        let timeLeft = 10;
        let touches = 0;
        let timerStarted = false;
        let timerInterval = null;

        const timeDisplay = document.getElementById("time");
        const countDisplay = document.getElementById("count");
        const touchArea = document.getElementById("touch-area");

        // GPT 랜덤 터치 수 (10개 선택지 중 1개, 10% 확률)
        const gptChoices = [81, 90, 95, 101, 107, 119, 83, 97, 110, 115];
        const gptTouches = gptChoices[Math.floor(Math.random() * gptChoices.length)];

        touchArea.addEventListener("touchstart", function () {
            if (!timerStarted) {
                timerStarted = true;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timeDisplay.textContent = timeLeft;

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        finishStage();
                    }
                }, 1000);
            }

            touches++;
            countDisplay.textContent = touches;
        });

        function finishStage() {
            if (touches > gptTouches) {
                // 성공 → success.html, GPT 터치 수 전달
                localStorage.setItem("gptTouches", gptTouches);
                window.location.href = "success.html";
            } else {
                // 실패 → fail.html
                localStorage.setItem("gptTouches", gptTouches);
                window.location.href = "fail.html";
            }


        }
    </script>

</body>

</html>
