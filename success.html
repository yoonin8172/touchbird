<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3단계 성공</title>
    <style>
        @font-face {
            font-family: 'JoseonGulim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'JoseonGulim', sans-serif;
            background: #fcfcff;
            color: rgb(9, 33, 248);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .image-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 5px 0;
        }

        .small-images img {
            width: 25%;
            max-width: 120px;
            height: auto;
        }

        .large-images img {
            width: 35%;
            max-width: 180px;
            height: auto;
        }

        #message {
            margin: 15px 0 5px 0;
        }

        button {
            font-family: 'JoseonGulim', sans-serif;
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 18px;
            cursor: pointer;
        }

        .large-images {
            margin-top: 40px;
            /* 이전보다 더 아래로 */
        }
    </style>
</head>

<body>

    <!-- 위쪽 이미지 1,2,3 -->
    <div class="image-row small-images">
        <img src="./images/1.jpeg" alt="success image 1">
        <img src="./images/2.jpeg" alt="success image 2">
        <img src="./images/3.jpeg" alt="success image 3">
    </div>

    <!-- 성공 메시지 -->
    <h1 id="message">성공! 새가 탈출했습니다!</h1>
    <p id="gpt-count"></p>

    <!-- 버튼 -->
    <button onclick="location.href='index.html'">처음으로</button>

    <!-- 아래쪽 이미지 4,5 -->
    <div class="image-row large-images">
        <img src="./images/4.jpeg" alt="success image 4">
        <img src="./images/5.jpeg" alt="success image 5">
    </div>

    <script>
        const gptTouches = localStorage.getItem("gptTouches");
        document.getElementById("gpt-count").textContent = `(GPT 터치 수: ${gptTouches})`;
    </script>

</body>

</html>
