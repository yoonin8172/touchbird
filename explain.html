<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>새장 안에 갇힌 새 - 게임 설명</title>
    <link rel="stylesheet" href="./src/style.css">
    <script src="https://clickbattle2025.web.app/click-battle.js"></script>
</head>

<body>

    <div id="game-container">
        <h1>게임 설명</h1>

        <p id="desc">
            이 게임은 새장 안에 갇힌 새를 구출하기 위해 <br>
            화면을 연타하는 게임입니다.<br><br>

            • 1단계: 제한 시간 내에 요구되는 터치 횟수를 달성하세요.(쉬움)<br>
            • 2단계: 제한 시간 내에 요구되는 터치 횟수를 달성하세요.(어려움)<br>
            • 3단계: GPT보다 더 많이 터치하여 새를 구출하세요.<br><br>

            각 단계에서 당신의 현재 터치 수는<br>실시간으로 표시됩니다.
        </p>


        <button id="next-btn">시작하기</button>
    </div>

    <script src="./src/main.js"></script>
</body>

</html>
